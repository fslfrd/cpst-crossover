[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpst-crossover"
version = "0.1.0"
description = "Cost per successful task and repair-cost crossovers between AI models, from published benchmarks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Faisal Fareed" }]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
